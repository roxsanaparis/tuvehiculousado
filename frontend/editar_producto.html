<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Producto</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


<div class="container py-5">

    <div class="card shadow-sm mx-auto" style="max-width: 650px;">

        <div class="card-body p-4">

            <h2 class="text-center">
                Editar producto
            </h2>

            <p class="text-center text-muted">
                Modifica la información de un producto.
            </p>


            <form id="editar-form">


                <div class="mb-3">

                    <label
                        for="id"
                        class="form-label">

                        ID del producto

                    </label>


                    <input
                        type="number"
                        id="id"
                        class="form-control"
                        min="1"
                        required>

                </div>


                <div class="mb-3">

                    <label
                        for="nombre"
                        class="form-label">

                        Nuevo nombre

                    </label>


                    <input
                        type="text"
                        id="nombre"
                        class="form-control"
                        required>

                </div>


                <div class="mb-3">

                    <label
                        for="precio"
                        class="form-label">

                        Nuevo precio

                    </label>


                    <input
                        type="number"
                        id="precio"
                        class="form-control"
                        min="0"
                        required>

                </div>


                <div class="mb-3">

                    <label
                        for="cantidad"
                        class="form-label">

                        Nueva cantidad

                    </label>


                    <input
                        type="number"
                        id="cantidad"
                        class="form-control"
                        min="0"
                        required>

                </div>


                <div class="d-grid">

                    <button
                        type="submit"
                        class="btn btn-warning">

                        Guardar cambios

                    </button>

                </div>

            </form>


            <div
                id="mensaje"
                class="alert d-none mt-4">
            </div>


            <div class="text-center mt-3">

                <a
                    href="index.html"
                    class="btn btn-secondary">

                    Volver al inicio

                </a>

            </div>

        </div>

    </div>

</div>


<script>

const parametros =
    new URLSearchParams(
        window.location.search
    );


const idURL =
    parametros.get('id');


if (idURL) {

    document.getElementById('id').value =
        idURL;

}


document.getElementById(
    'editar-form'
).addEventListener(
    'submit',
    async function(event) {

        event.preventDefault();


        const id =
            document.getElementById('id').value;

        const nombre =
            document.getElementById('nombre').value;

        const precio =
            document.getElementById('precio').value;

        const cantidad =
            document.getElementById('cantidad').value;


        const mensaje =
            document.getElementById('mensaje');


        try {

            const respuesta = await fetch(
                `http://192.168.100.3:3000/api/productos/${id}`,
                {

                    method: 'PUT',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify({
                        nombre,
                        precio,
                        cantidad
                    })

                }
            );


            const data =
                await respuesta.json();


            if (!respuesta.ok) {

                throw new Error(
                    data.error ||
                    'No se pudo actualizar el producto'
                );

            }


            mensaje.className =
                'alert alert-success mt-4';

            mensaje.textContent =
                'Producto actualizado correctamente.';


        } catch (error) {

            mensaje.className =
                'alert alert-danger mt-4';

            mensaje.textContent =
                'Error: ' + error.message;

        }

    }

);

</script>


</body>

</html>
