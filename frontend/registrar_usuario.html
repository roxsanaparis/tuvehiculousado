<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Tu Vehículo Usado | Crear cuenta</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            min-height: 100vh;

            background:
                linear-gradient(
                    rgba(15, 23, 42, 0.90),
                    rgba(15, 23, 42, 0.94)
                ),
                linear-gradient(
                    135deg,
                    #1e293b,
                    #334155
                );

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 15px;
        }


        .register-wrapper {
            width: 100%;
            max-width: 600px;
        }


        .brand {
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }


        .brand h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }


        .brand p {
            color: #cbd5e1;
            margin: 0;
        }


        .register-card {
            background: white;
            border-radius: 18px;
            padding: 35px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.30);
        }


        .register-card h2 {
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 8px;
        }


        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
        }


        .form-label {
            font-weight: 600;
            color: #334155;
        }


        .form-control {
            border-radius: 10px;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
        }


        .form-control:focus {
            border-color: #334155;

            box-shadow:
                0 0 0 0.2rem
                rgba(51, 65, 85, 0.15);
        }


        .btn-register {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 13px;

            background: #1e293b;
            color: white;

            font-weight: 600;
        }


        .btn-register:hover {
            background: #0f172a;
        }


        #mensaje {
            min-height: 24px;
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }


        .login-link {
            text-align: center;
            margin-top: 25px;
            padding-top: 22px;
            border-top: 1px solid #e2e8f0;
        }


        .login-link p {
            color: #64748b;
            margin-bottom: 10px;
        }


    </style>

</head>


<body>


<div class="register-wrapper">


    <div class="brand">

        <h1>
            Tu Vehículo Usado
        </h1>

        <p>
            Compra y venta de vehículos usados
        </p>

    </div>


    <div class="register-card">


        <h2 class="text-center">
            Crear cuenta
        </h2>


        <p class="subtitle text-center">
            Regístrate para comenzar
        </p>


        <form id="formRegistro">


            <!-- NOMBRE -->

            <div class="mb-3">

                <label
                    for="nombre"
                    class="form-label">

                    Nombre completo

                </label>

                <input
                    type="text"
                    id="nombre"
                    class="form-control"
                    placeholder="Tu nombre completo"
                    autocomplete="name"
                    required>

            </div>


            <!-- CORREO -->

            <div class="mb-3">

                <label
                    for="correo"
                    class="form-label">

                    Correo electrónico

                </label>

                <input
                    type="email"
                    id="correo"
                    class="form-control"
                    placeholder="correo@ejemplo.com"
                    autocomplete="email"
                    required>

            </div>


            <!-- TELEFONO -->

            <div class="mb-3">

                <label
                    for="telefono"
                    class="form-label">

                    Teléfono

                </label>

                <input
                    type="tel"
                    id="telefono"
                    class="form-control"
                    placeholder="3001234567"
                    autocomplete="tel"
                    required>

            </div>


            <!-- CIUDAD -->

            <div class="mb-3">

                <label
                    for="ciudad"
                    class="form-label">

                    Ciudad

                </label>

                <input
                    type="text"
                    id="ciudad"
                    class="form-control"
                    placeholder="Cali"
                    autocomplete="address-level2"
                    required>

            </div>


            <!-- PASSWORD -->

            <div class="mb-3">

                <label
                    for="password"
                    class="form-label">

                    Contraseña

                </label>

                <input
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="Crea una contraseña"
                    autocomplete="new-password"
                    required>

            </div>


            <!-- CONFIRMAR PASSWORD -->

            <div class="mb-4">

                <label
                    for="passwordConfirm"
                    class="form-label">

                    Confirmar contraseña

                </label>

                <input
                    type="password"
                    id="passwordConfirm"
                    class="form-control"
                    placeholder="Repite la contraseña"
                    autocomplete="new-password"
                    required>

            </div>


            <button
                type="submit"
                class="btn-register">

                Crear cuenta

            </button>


        </form>


        <div id="mensaje"></div>


        <div class="login-link">

            <p>
                ¿Ya tienes una cuenta?
            </p>

            <a
                href="index.html"
                class="btn btn-outline-dark">

                Iniciar sesión

            </a>

        </div>


    </div>


</div>


<script>


document
    .getElementById("formRegistro")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const nombre =
                document
                    .getElementById("nombre")
                    .value
                    .trim();


            const correo =
                document
                    .getElementById("correo")
                    .value
                    .trim();


            const telefono =
                document
                    .getElementById("telefono")
                    .value
                    .trim();


            const ciudad =
                document
                    .getElementById("ciudad")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const passwordConfirm =
                document
                    .getElementById("passwordConfirm")
                    .value;


            const mensaje =
                document.getElementById(
                    "mensaje"
                );


            mensaje.className = "";
            mensaje.textContent = "";


            if (
                password !==
                passwordConfirm
            ) {

                mensaje.className =
                    "text-danger";

                mensaje.textContent =
                    "Las contraseñas no coinciden.";

                return;

            }


            if (
                password.length < 4
            ) {

                mensaje.className =
                    "text-danger";

                mensaje.textContent =
                    "La contraseña debe tener al menos 4 caracteres.";

                return;

            }


            mensaje.className =
                "text-info";

            mensaje.textContent =
                "Creando cuenta...";


            try {


                const usuario = {

                    nombre:
                        nombre,

                    correo:
                        correo,

                    password:
                        password,

                    ciudad:
                        ciudad,

                    telefono:
                        telefono,

                    rol:
                        "cliente"

                };


                console.log(
                    "DATOS REGISTRO:",
                    usuario
                );


                const respuesta =
                    await fetch(
                        "/api/usuarios",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify(
                                    usuario
                                )

                        }
                    );


                const texto =
                    await respuesta.text();


                let datos;


                try {

                    datos =
                        JSON.parse(
                            texto
                        );

                } catch {

                    datos = {
                        mensaje: texto
                    };

                }


                console.log(
                    "RESPUESTA REGISTRO:",
                    respuesta.status,
                    datos
                );


                if (!respuesta.ok) {

                    throw new Error(
                        datos.error ||
                        datos.mensaje ||
                        "No fue posible crear la cuenta."
                    );

                }


                mensaje.className =
                    "text-success";

                mensaje.textContent =
                    "Cuenta creada correctamente. Redirigiendo...";


                setTimeout(
                    function() {

                        window.location.href =
                            "index.html";

                    },
                    1200
                );


            } catch (error) {


                console.error(
                    "ERROR REGISTRO:",
                    error
                );


                mensaje.className =
                    "text-danger";

                mensaje.textContent =
                    error.message ||
                    "No fue posible crear la cuenta.";

            }

        }
    );


</script>


</body>

</html>
