<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Gestión de usuarios - Tu Vehículo Usado
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <span class="navbar-brand">
            Tu Vehículo Usado
        </span>

        <a
            href="admin.html"
            class="btn btn-outline-light">

            Volver al panel

        </a>

    </div>

</nav>


<div class="container py-4">


    <!-- ENCABEZADO -->

    <div class="mb-4">

        <h2>
            Gestión de usuarios
        </h2>

        <p
            id="bienvenida"
            class="text-muted">
        </p>

    </div>


    <!-- MENSAJES -->

    <div id="mensaje"></div>


    <!-- FORMULARIO -->

    <div class="card shadow mb-4">

        <div class="card-body">

            <h4 class="mb-4">
                Crear / editar usuario
            </h4>


            <form id="formUsuario">


                <input
                    type="hidden"
                    id="usuarioId">


                <div class="row">


                    <!-- NOMBRE -->

                    <div class="col-md-6 mb-3">

                        <label
                            for="nombre"
                            class="form-label">

                            Nombre completo

                        </label>

                        <input
                            type="text"
                            id="nombre"
                            class="form-control"
                            required>

                    </div>


                    <!-- CORREO -->

                    <div class="col-md-6 mb-3">

                        <label
                            for="correo"
                            class="form-label">

                            Correo

                        </label>

                        <input
                            type="email"
                            id="correo"
                            class="form-control"
                            required>

                    </div>


                    <!-- PASSWORD -->

                    <div class="col-md-6 mb-3">

                        <label
                            for="password"
                            class="form-label">

                            Contraseña

                        </label>

                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            required>

                    </div>


                    <!-- ROL -->

                    <div class="col-md-6 mb-3">

                        <label
                            for="rol"
                            class="form-label">

                            Rol

                        </label>

                        <select
                            id="rol"
                            class="form-select"
                            required>

                            <option value="">
                                Seleccione un rol
                            </option>

                            <option value="cliente">
                                Cliente
                            </option>

                            <option value="vendedor">
                                Vendedor
                            </option>

                            <option value="administrador">
                                Administrador
                            </option>

                        </select>

                    </div>


                    <!-- CIUDAD -->

                    <div class="col-md-6 mb-3">

                        <label
                            for="ciudad"
                            class="form-label">

                            Ciudad

                        </label>

                        <input
                            type="text"
                            id="ciudad"
                            class="form-control"
                            required>

                    </div>


                    <!-- TELEFONO -->

                    <div class="col-md-6 mb-3">

                        <label
                            for="telefono"
                            class="form-label">

                            Teléfono

                        </label>

                        <input
                            type="text"
                            id="telefono"
                            class="form-control"
                            required>

                    </div>


                    <!-- ESTADO -->

                    <div class="col-md-6 mb-3">

                        <label
                            for="estado"
                            class="form-label">

                            Estado

                        </label>

                        <select
                            id="estado"
                            class="form-select"
                            required>

                            <option value="activo">
                                Activo
                            </option>

                            <option value="inactivo">
                                Inactivo
                            </option>

                        </select>

                    </div>


                </div>


                <button
                    type="submit"
                    class="btn btn-primary">

                    Guardar usuario

                </button>


                <button
                    type="button"
                    id="btnCancelar"
                    class="btn btn-secondary">

                    Cancelar

                </button>


            </form>

        </div>

    </div>


    <!-- TABLA -->

    <div class="card shadow">

        <div class="card-body">

            <div
                class="d-flex justify-content-between align-items-center mb-3">

                <h4>
                    Usuarios registrados
                </h4>

                <button
                    class="btn btn-outline-primary"
                    onclick="cargarUsuarios()">

                    🔄 Actualizar

                </button>

            </div>


            <div class="table-responsive">

                <table
                    class="table table-bordered table-hover align-middle">

                    <thead class="table-dark">

                        <tr>

                            <th>ID</th>

                            <th>Nombre</th>

                            <th>Correo</th>

                            <th>Rol</th>

                            <th>Ciudad</th>

                            <th>Teléfono</th>

                            <th>Fecha registro</th>

                            <th>Estado</th>

                            <th>Acciones</th>

                        </tr>

                    </thead>


                    <tbody
                        id="tablaUsuarios">

                    </tbody>

                </table>

            </div>

        </div>

    </div>


</div>


<script>

const API = "/api/usuarios";


// ==========================================
// USUARIO ACTUAL
// ==========================================

const usuarioActual =
    JSON.parse(
        localStorage.getItem("usuario")
    );


// ==========================================
// COMPROBAR ADMIN
// ==========================================

if (
    !usuarioActual ||
    (
        usuarioActual.rol !== "admin" &&
        usuarioActual.rol !== "administrador"
    )
) {

    window.location.href =
        "login.html";

}


// ==========================================
// BIENVENIDA
// ==========================================

if (usuarioActual) {

    document
        .getElementById("bienvenida")
        .textContent =
        "Bienvenido, " +
        usuarioActual.nombre;

}


// ==========================================
// MENSAJES
// ==========================================

function mostrarMensaje(
    texto,
    tipo
) {

    document
        .getElementById("mensaje")
        .innerHTML = `

            <div class="alert alert-${tipo}">

                ${texto}

            </div>

        `;

}


// ==========================================
// CARGAR USUARIOS
// ==========================================

async function cargarUsuarios() {

    try {

        const respuesta = await fetch(API, {
            cache: "no-store"
        });

        const datos = await respuesta.json();

        console.log("USUARIOS RECIBIDOS:", datos);

        if (!respuesta.ok) {
            throw new Error(
                datos.error ||
                "No se pudieron cargar los usuarios"
            );
        }

        const tabla =
            document.getElementById("tablaUsuarios");

        if (!Array.isArray(datos)) {
            throw new Error(
                "La API no devolvió un arreglo de usuarios"
            );
        }

        if (datos.length === 0) {

            tabla.innerHTML = `
                <tr>
                    <td colspan="9" class="text-center">
                        No hay usuarios registrados.
                    </td>
                </tr>
            `;

            return;
        }

        const filas = datos.map(usuario => {

            let colorRol = "primary";

            if (
                usuario.rol === "admin" ||
                usuario.rol === "administrador"
            ) {
                colorRol = "danger";
            }
            else if (usuario.rol === "vendedor") {
                colorRol = "warning";
            }

            const colorEstado =
                usuario.estado === "activo"
                    ? "success"
                    : "secondary";

            const fecha =
                usuario.fecha_registro
                    ? new Date(
                        usuario.fecha_registro
                    ).toLocaleString("es-CO")
                    : "Sin fecha";

            return `
                <tr>

                    <td>
                        ${usuario.id}
                    </td>

                    <td>
                        ${usuario.nombre || ""}
                    </td>

                    <td>
                        ${usuario.correo || ""}
                    </td>

                    <td>
                        <span class="badge bg-${colorRol}">
                            ${usuario.rol || ""}
                        </span>
                    </td>

                    <td>
                        ${usuario.ciudad || "Sin registrar"}
                    </td>

                    <td>
                        ${usuario.telefono || "Sin registrar"}
                    </td>

                    <td>
                        ${fecha}
                    </td>

                    <td>
                        <span class="badge bg-${colorEstado}">
                            ${usuario.estado || "Sin estado"}
                        </span>
                    </td>

                    <td>

                        <button
                            class="btn btn-warning btn-sm me-1"
                            onclick="editarUsuario(${usuario.id})">
                            ✏️
                        </button>

                        <button
                            class="btn btn-danger btn-sm"
                            onclick="eliminarUsuario(${usuario.id})">
                            🗑️
                        </button>

                    </td>

                </tr>
            `;
        }).join("");

        tabla.innerHTML = filas;

    } catch (error) {

        console.error(
            "ERROR CARGANDO USUARIOS:",
            error
        );

        const tabla =
            document.getElementById("tablaUsuarios");

        tabla.innerHTML = `
            <tr>
                <td colspan="9" class="text-center text-danger">
                    Error cargando usuarios:
                    ${error.message}
                </td>
            </tr>
        `;
    }
}


async function editarUsuario(id) {

    try {

        const respuesta =
            await fetch(
                API + "/" + id
            );


        const usuario =
            await respuesta.json();


        if (!respuesta.ok) {

            throw new Error(
                usuario.error ||
                "No se pudo consultar el usuario"
            );

        }


        document
            .getElementById(
                "usuarioId"
            )
            .value =
            usuario.id;


        document
            .getElementById(
                "nombre"
            )
            .value =
            usuario.nombre;


        document
            .getElementById(
                "correo"
            )
            .value =
            usuario.correo;


        document
            .getElementById(
                "password"
            )
            .value = "";


        document
            .getElementById(
                "rol"
            )
            .value =
            usuario.rol;


        document
            .getElementById(
                "ciudad"
            )
            .value =
            usuario.ciudad || "";


        document
            .getElementById(
                "telefono"
            )
            .value =
            usuario.telefono || "";


        document
            .getElementById(
                "estado"
            )
            .value =
            usuario.estado || "activo";


        mostrarMensaje(
            "Usuario cargado para editar.",
            "info"
        );


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });


    } catch (error) {

        console.error(error);

        mostrarMensaje(
            error.message,
            "danger"
        );

    }

}


// ==========================================
// ELIMINAR
// ==========================================

async function eliminarUsuario(id) {

    const confirmar =
        confirm(
            "¿Seguro que deseas eliminar este usuario?"
        );


    if (!confirmar) {

        return;

    }


    try {

        const respuesta =
            await fetch(
                API + "/" + id,
                {

                    method:
                        "DELETE"

                }
            );


        const datos =
            await respuesta.json();


        if (!respuesta.ok) {

            throw new Error(
                datos.error ||
                "No se pudo eliminar"
            );

        }


        mostrarMensaje(
            datos.mensaje ||
            "Usuario eliminado correctamente",
            "success"
        );


        await cargarUsuarios();


    } catch (error) {

        console.error(error);

        mostrarMensaje(
            error.message,
            "danger"
        );

    }

}


// ==========================================
// LIMPIAR FORMULARIO
// ==========================================

function limpiarFormulario() {

    document
        .getElementById(
            "formUsuario"
        )
        .reset();


    document
        .getElementById(
            "usuarioId"
        )
        .value = "";


    document
        .getElementById(
            "estado"
        )
        .value =
        "activo";

}


// ==========================================
// CANCELAR
// ==========================================

document
    .getElementById(
        "btnCancelar"
    )
    .addEventListener(
        "click",
        limpiarFormulario
    );


// ==========================================
// CARGAR AL ENTRAR
// ==========================================

cargarUsuarios();

cargarUsuarios();
</script>


</body>

</html>
