
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de usuarios - Tu Vehículo Usado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">Tu Vehículo Usado</span>
        <a href="admin.html" class="btn btn-outline-light">Volver al panel</a>
    </div>
</nav>

<div class="container py-4">

    <div class="mb-4">
        <h2>Gestión de usuarios</h2>
        <p id="bienvenida" class="text-muted"></p>
    </div>

    <div id="mensaje"></div>

    <div class="card shadow mb-4">
        <div class="card-body">
            <h4 class="mb-4">Crear / editar usuario</h4>

            <form id="formUsuario">
                <input type="hidden" id="usuarioId">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label for="nombre" class="form-label">Nombre completo</label>
                        <input type="text" id="nombre" class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="correo" class="form-label">Correo</label>
                        <input type="email" id="correo" class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" id="password" class="form-control" required minlength="4">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="rol" class="form-label">Rol</label>
                        <select id="rol" class="form-select" required>
                            <option value="">Seleccione un rol</option>
                            <option value="cliente">Cliente</option>
                            <option value="vendedor">Vendedor</option>
                            <option value="administrador">Administrador</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="ciudad" class="form-label">Ciudad</label>
                        <input type="text" id="ciudad" class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="telefono" class="form-label">Teléfono</label>
                        <input type="text" id="telefono" class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="estado" class="form-label">Estado</label>
                        <select id="estado" class="form-select" required>
                            <option value="activo">Activo</option>
                            <option value="inactivo">Inactivo</option>
                        </select>
                    </div>

                </div>

                <button type="submit" id="btnGuardar" class="btn btn-primary">
                    Guardar usuario
                </button>

                <button type="button" id="btnCancelar" class="btn btn-secondary">
                    Cancelar
                </button>
            </form>
        </div>
    </div>

    <div class="card shadow">
        <div class="card-body">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4>Usuarios registrados</h4>
                <button class="btn btn-outline-primary" id="btnActualizar">
                    🔄 Actualizar
                </button>
            </div>

            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Rol</th>
                            <th>Ciudad</th>
                            <th>Teléfono</th>
                            <th>Fecha registro</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaUsuarios"></tbody>
                </table>
            </div>

        </div>
    </div>

</div>

<script>
const API = "/api/usuarios";

const usuarioActual = JSON.parse(localStorage.getItem("usuario") || "null");

if (
    !usuarioActual ||
    !["admin", "administrador"].includes(usuarioActual.rol)
) {
    window.location.href = "login.html";
}

if (usuarioActual) {
    document.getElementById("bienvenida").textContent =
        "Bienvenido, " + usuarioActual.nombre;
}

function mostrarMensaje(texto, tipo) {
    const mensaje = document.getElementById("mensaje");
    mensaje.innerHTML = "";

    const alerta = document.createElement("div");
    alerta.className = "alert alert-" + tipo;
    alerta.textContent = texto;

    mensaje.appendChild(alerta);
}

async function leerRespuesta(respuesta) {
    const texto = await respuesta.text();

    let datos;

    try {
        datos = JSON.parse(texto);
    } catch {
        datos = { error: texto || "Respuesta no válida del servidor" };
    }

    if (!respuesta.ok) {
        throw new Error(
            datos.error || datos.mensaje || "Error en la solicitud"
        );
    }

    return datos;
}

// CONSULTAR USUARIOS
async function cargarUsuarios() {
    const tabla = document.getElementById("tablaUsuarios");

    try {
        const respuesta = await fetch(API, { cache: "no-store" });
        const datos = await leerRespuesta(respuesta);

        if (!Array.isArray(datos)) {
            throw new Error("La API no devolvió una lista de usuarios");
        }

        tabla.innerHTML = "";

        if (datos.length === 0) {
            tabla.innerHTML = `
                <tr>
                    <td colspan="9" class="text-center">
                        No hay usuarios registrados.
                    </td>
                </tr>`;
            return;
        }

        datos.forEach(usuario => {
            const fila = document.createElement("tr");

            const valores = [
                usuario.id,
                usuario.nombre,
                usuario.correo,
                usuario.rol,
                usuario.ciudad || "Sin registrar",
                usuario.telefono || "Sin registrar",
                usuario.fecha_registro
                    ? new Date(usuario.fecha_registro).toLocaleString("es-CO")
                    : "Sin fecha",
                usuario.estado || "Sin estado"
            ];

            valores.forEach(valor => {
                const celda = document.createElement("td");
                celda.textContent = valor ?? "";
                fila.appendChild(celda);
            });

            const acciones = document.createElement("td");

            const btnEditar = document.createElement("button");
            btnEditar.className = "btn btn-warning btn-sm me-1";
            btnEditar.textContent = "✏️";
            btnEditar.addEventListener("click", () => editarUsuario(usuario.id));

            const btnEliminar = document.createElement("button");
            btnEliminar.className = "btn btn-danger btn-sm";
            btnEliminar.textContent = "🗑️";
            btnEliminar.addEventListener("click", () => eliminarUsuario(usuario.id));

            acciones.appendChild(btnEditar);
            acciones.appendChild(btnEliminar);
            fila.appendChild(acciones);

            tabla.appendChild(fila);
        });

    } catch (error) {
        console.error("ERROR CARGANDO USUARIOS:", error);
        tabla.innerHTML = `
            <tr>
                <td colspan="9" class="text-center text-danger">
                    ${error.message}
                </td>
            </tr>`;
    }
}

// CREAR Y ACTUALIZAR USUARIOS
document.getElementById("formUsuario").addEventListener("submit", async function(event) {
    event.preventDefault();

    const id = document.getElementById("usuarioId").value;

    const usuario = {
        nombre: document.getElementById("nombre").value.trim(),
        correo: document.getElementById("correo").value.trim(),
        password: document.getElementById("password").value,
        rol: document.getElementById("rol").value,
        ciudad: document.getElementById("ciudad").value.trim(),
        telefono: document.getElementById("telefono").value.trim(),
        estado: document.getElementById("estado").value
    };

    if (
        !usuario.nombre ||
        !usuario.correo ||
        !usuario.password ||
        !usuario.rol ||
        !usuario.ciudad ||
        !usuario.telefono
    ) {
        mostrarMensaje("Debes completar todos los campos, incluida la contraseña.", "danger");
        return;
    }

    if (usuario.password.length < 4) {
        mostrarMensaje("La contraseña debe tener al menos 4 caracteres.", "danger");
        return;
    }

    const boton = document.getElementById("btnGuardar");
    boton.disabled = true;
    boton.textContent = "Guardando...";

    try {
        const url = id ? `${API}/${id}` : API;
        const metodo = id ? "PUT" : "POST";

        console.log("ENVIANDO USUARIO:", metodo, url);

        const respuesta = await fetch(url, {
            method: metodo,
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(usuario)
        });

        const datos = await leerRespuesta(respuesta);

        mostrarMensaje(
            datos.mensaje || (id
                ? "Usuario actualizado correctamente."
                : "Usuario creado correctamente."),
            "success"
        );

        limpiarFormulario();
        await cargarUsuarios();

    } catch (error) {
        console.error("ERROR GUARDANDO USUARIO:", error);
        mostrarMensaje(error.message, "danger");
    } finally {
        boton.disabled = false;
        boton.textContent = "Guardar usuario";
    }
});

// CONSULTAR UN USUARIO PARA EDITAR
async function editarUsuario(id) {
    try {
        const respuesta = await fetch(`${API}/${id}`);
        const usuario = await leerRespuesta(respuesta);

        document.getElementById("usuarioId").value = usuario.id;
        document.getElementById("nombre").value = usuario.nombre || "";
        document.getElementById("correo").value = usuario.correo || "";
        document.getElementById("password").value = "";
        document.getElementById("rol").value = usuario.rol || "";
        document.getElementById("ciudad").value = usuario.ciudad || "";
        document.getElementById("telefono").value = usuario.telefono || "";
        document.getElementById("estado").value = usuario.estado || "activo";

        mostrarMensaje(
            "Usuario cargado. Escribe una contraseña para guardar los cambios.",
            "info"
        );

        window.scrollTo({ top: 0, behavior: "smooth" });

    } catch (error) {
        mostrarMensaje(error.message, "danger");
    }
}

// ELIMINAR USUARIO
async function eliminarUsuario(id) {
    if (!confirm("¿Seguro que deseas eliminar este usuario?")) {
        return;
    }

    try {
        const respuesta = await fetch(`${API}/${id}`, {
            method: "DELETE"
        });

        const datos = await leerRespuesta(respuesta);

        mostrarMensaje(
            datos.mensaje || "Usuario eliminado correctamente.",
            "success"
        );

        await cargarUsuarios();

    } catch (error) {
        mostrarMensaje(error.message, "danger");
    }
}

// LIMPIAR FORMULARIO
function limpiarFormulario() {
    document.getElementById("formUsuario").reset();
    document.getElementById("usuarioId").value = "";
    document.getElementById("estado").value = "activo";
}

// BOTONES
document.getElementById("btnCancelar").addEventListener("click", function() {
    limpiarFormulario();
    document.getElementById("mensaje").innerHTML = "";
});

document.getElementById("btnActualizar").addEventListener("click", cargarUsuarios);

// CARGAR UNA SOLA VEZ
cargarUsuarios();
</script>

</body>
</html>
