<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Gestión de Usuarios - Tu Vehículo Usado
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-5">

    <!-- ENCABEZADO -->

    <div
        class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2>
                👥 Gestión de Usuarios
            </h2>

            <p
                id="bienvenida"
                class="text-muted mb-0">
            </p>

        </div>

        <div class="d-flex gap-2">

            <button
                class="btn btn-secondary"
                onclick="volverAdmin()">

                🚗 Panel administrador

            </button>

            <button
                class="btn btn-danger"
                onclick="cerrarSesion()">

                Cerrar sesión

            </button>

        </div>

    </div>


    <!-- MENSAJES -->

    <div id="mensaje"></div>


    <!-- FORMULARIO -->

    <div class="card shadow mb-4">

        <div class="card-body">

            <h4
                id="tituloFormulario"
                class="mb-4">

                Registrar usuario

            </h4>

            <form id="formUsuario">

                <input
                    type="hidden"
                    id="usuarioId">


                <!-- NOMBRE -->

                <div class="mb-3">

                    <label class="form-label">
                        Nombre
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        class="form-control"
                        placeholder="Nombre completo"
                        required>

                </div>


                <!-- CORREO -->

                <div class="mb-3">

                    <label class="form-label">
                        Correo
                    </label>

                    <input
                        type="email"
                        id="correo"
                        class="form-control"
                        placeholder="correo@ejemplo.com"
                        required>

                </div>


                <!-- CONTRASEÑA -->

                <div class="mb-3">

                    <label class="form-label">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Contraseña"
                        required>

                </div>


                <!-- ROL -->

                <div class="mb-3">

                    <label class="form-label">
                        Rol
                    </label>

                    <select
                        id="rol"
                        class="form-select"
                        required>

                        <option value="">
                            Seleccione un rol
                        </option>

                        <option value="cliente">
                            Cliente
                        </option>

                        <option value="vendedor">
                            Vendedor
                        </option>

                        <option value="administrador">
                            Administrador
                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="btn btn-success">

                    💾 Guardar usuario

                </button>


                <button
                    type="button"
                    id="btnCancelar"
                    class="btn btn-secondary d-none"
                    onclick="cancelarEdicion()">

                    Cancelar edición

                </button>

            </form>

        </div>

    </div>


    <!-- LISTADO -->

    <div class="card shadow">

        <div class="card-body">

            <div
                class="d-flex justify-content-between align-items-center mb-3">

                <h4 class="mb-0">
                    Usuarios registrados
                </h4>

                <button
                    class="btn btn-primary"
                    onclick="cargarUsuarios()">

                    🔄 Actualizar lista

                </button>

            </div>


            <div class="table-responsive">

                <table
                    class="table table-bordered table-hover align-middle">

                    <thead class="table-dark">

                        <tr>

                            <th>ID</th>

                            <th>Nombre</th>

                            <th>Correo</th>

                            <th>Rol</th>

                            <th>Acciones</th>

                        </tr>

                    </thead>

                    <tbody id="tablaUsuarios"></tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script>

const API =
    "/api/usuarios";


const usuarioActual =
    JSON.parse(
        localStorage.getItem("usuario")
    );


// COMPROBAR ADMINISTRADOR

if (
    !usuarioActual ||
    usuarioActual.rol !== "administrador"
) {

    window.location.href =
        "login.html";

} else {

    document
        .getElementById("bienvenida")
        .textContent =
        "Bienvenido, " +
        usuarioActual.nombre;

}


// MOSTRAR MENSAJE

function mostrarMensaje(texto, tipo) {

    document
        .getElementById("mensaje")
        .innerHTML = `

            <div class="alert alert-${tipo}">

                ${texto}

            </div>

        `;

    setTimeout(() => {

        document
            .getElementById("mensaje")
            .innerHTML = "";

    }, 4000);

}


// CARGAR USUARIOS

async function cargarUsuarios() {

    try {

        const respuesta =
            await fetch(API);

        const datos =
            await respuesta.json();

        if (!respuesta.ok) {

            throw new Error(
                datos.error ||
                "No se pudieron consultar los usuarios"
            );

        }

        const tabla =
            document.getElementById(
                "tablaUsuarios"
            );

        tabla.innerHTML = "";


        if (datos.length === 0) {

            tabla.innerHTML = `

                <tr>

                    <td
                        colspan="5"
                        class="text-center">

                        No hay usuarios registrados.

                    </td>

                </tr>

            `;

            return;

        }


        datos.forEach(usuario => {

            let colorRol;

            if (usuario.rol === "administrador") {

                colorRol = "danger";

            } else if (usuario.rol === "vendedor") {

                colorRol = "warning";

            } else {

                colorRol = "primary";

            }


            tabla.innerHTML += `

                <tr>

                    <td>
                        ${usuario.id}
                    </td>

                    <td>
                        ${usuario.nombre}
                    </td>

                    <td>
                        ${usuario.correo}
                    </td>

                    <td>

                        <span
                            class="badge bg-${colorRol}">

                            ${usuario.rol}

                        </span>

                    </td>

                    <td>

                        <button
                            class="btn btn-warning btn-sm me-1"
                            onclick="editarUsuario(${usuario.id})">

                            ✏️ Editar

                        </button>

                        <button
                            class="btn btn-danger btn-sm"
                            onclick="eliminarUsuario(${usuario.id})">

                            🗑️ Eliminar

                        </button>

                    </td>

                </tr>

            `;

        });


    } catch (error) {

        console.error(error);

        mostrarMensaje(
            "No se pudieron cargar los usuarios: " +
            error.message,
            "danger"
        );

    }

}


// GUARDAR USUARIO

document
    .getElementById("formUsuario")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const id =
                document
                    .getElementById("usuarioId")
                    .value;

            const usuario = {

                nombre:
                    document
                        .getElementById("nombre")
                        .value
                        .trim(),

                correo:
                    document
                        .getElementById("correo")
                        .value
                        .trim(),

                password:
                    document
                        .getElementById("password")
                        .value,

                rol:
                    document
                        .getElementById("rol")
                        .value

            };


            try {

                let respuesta;


                if (!id) {

                    respuesta =
                        await fetch(
                            API,
                            {

                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify(usuario)

                            }
                        );

                } else {

                    respuesta =
                        await fetch(
                            API + "/" + id,
                            {

                                method: "PUT",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify(usuario)

                            }
                        );

                }


                const datos =
                    await respuesta.json();


                if (!respuesta.ok) {

                    throw new Error(
                        datos.error ||
                        datos.mensaje ||
                        "No se pudo guardar el usuario"
                    );

                }


                mostrarMensaje(
                    id
                        ? "Usuario actualizado correctamente."
                        : "Usuario registrado correctamente.",
                    "success"
                );


                cancelarEdicion();

                await cargarUsuarios();


            } catch (error) {

                console.error(error);

                mostrarMensaje(
                    error.message,
                    "danger"
                );

            }

        }
    );


// EDITAR

async function editarUsuario(id) {

    try {

        const respuesta =
            await fetch(
                API + "/" + id
            );

        const usuario =
            await respuesta.json();


        if (!respuesta.ok) {

            throw new Error(
                usuario.error ||
                "No se pudo consultar el usuario"
            );

        }


        document
            .getElementById("usuarioId")
            .value =
            usuario.id;

        document
            .getElementById("nombre")
            .value =
            usuario.nombre;

        document
            .getElementById("correo")
            .value =
            usuario.correo;

        document
            .getElementById("password")
            .value = "";

        document
            .getElementById("rol")
            .value =
            usuario.rol;

        document
            .getElementById("tituloFormulario")
            .textContent =
            "Editar usuario";

        document
            .getElementById("btnCancelar")
            .classList
            .remove("d-none");

        window.scrollTo({

            top: 0,

            behavior: "smooth"

        });


    } catch (error) {

        mostrarMensaje(
            error.message,
            "danger"
        );

    }

}


// CANCELAR EDICIÓN

function cancelarEdicion() {

    document
        .getElementById("formUsuario")
        .reset();

    document
        .getElementById("usuarioId")
        .value = "";

    document
        .getElementById("tituloFormulario")
        .textContent =
        "Registrar usuario";

    document
        .getElementById("btnCancelar")
        .classList
        .add("d-none");

}


// ELIMINAR

async function eliminarUsuario(id) {

    if (
        Number(id) ===
        Number(usuarioActual.id)
    ) {

        alert(
            "No puedes eliminar el usuario con el que estás conectado."
        );

        return;

    }


    if (
        !confirm(
            "¿Seguro que deseas eliminar este usuario?"
        )
    ) {

        return;

    }


    try {

        const respuesta =
            await fetch(
                API + "/" + id,
                {

                    method: "DELETE"

                }
            );


        const datos =
            await respuesta.json();


        if (!respuesta.ok) {

            throw new Error(
                datos.error ||
                "No se pudo eliminar el usuario"
            );

        }


        mostrarMensaje(
            "Usuario eliminado correctamente.",
            "success"
        );


        await cargarUsuarios();


    } catch (error) {

        mostrarMensaje(
            error.message,
            "danger"
        );

    }

}


// VOLVER AL ADMIN

function volverAdmin() {

    window.location.href =
        "admin.html";

}


// CERRAR SESIÓN

function cerrarSesion() {

    localStorage.removeItem(
        "usuario"
    );

    window.location.href =
        "login.html";

}


// INICIAR

cargarUsuarios();

</script>

</body>

</html>
