<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Borrar Producto</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


<div class="container py-5">

    <div class="card shadow-sm mx-auto" style="max-width: 600px;">

        <div class="card-body p-4">

            <h2 class="text-center text-danger">
                Borrar producto
            </h2>

            <p class="text-center text-muted">
                Esta acción eliminará el producto de la base de datos.
            </p>


            <form id="borrar-form">

                <div class="mb-3">

                    <label
                        for="id"
                        class="form-label">

                        ID del producto

                    </label>


                    <input
                        type="number"
                        id="id"
                        class="form-control"
                        min="1"
                        required>

                </div>


                <div class="d-grid">

                    <button
                        type="submit"
                        class="btn btn-danger">

                        Borrar producto

                    </button>

                </div>

            </form>


            <div
                id="mensaje"
                class="alert d-none mt-4">
            </div>


            <div class="text-center mt-3">

                <a
                    href="index.html"
                    class="btn btn-secondary">

                    Volver al inicio

                </a>

            </div>

        </div>

    </div>

</div>


<script>

document.getElementById(
    'borrar-form'
).addEventListener(
    'submit',
    async function(event) {

        event.preventDefault();


        const id =
            document.getElementById('id').value;


        const mensaje =
            document.getElementById('mensaje');


        const confirmar =
            confirm(
                `¿Está seguro de que desea borrar el producto con ID ${id}?`
            );


        if (!confirmar) {

            return;

        }


        try {

            const respuesta = await fetch(
                `http://192.168.100.3:3000/api/productos/${id}`,
                {

                    method: 'DELETE'

                }
            );


            const data =
                await respuesta.json();


            if (!respuesta.ok) {

                throw new Error(
                    data.error ||
                    'No se pudo eliminar el producto'
                );

            }


            mensaje.className =
                'alert alert-success mt-4';

            mensaje.textContent =
                'Producto eliminado correctamente.';


            document
                .getElementById('borrar-form')
                .reset();


        } catch (error) {

            mensaje.className =
                'alert alert-danger mt-4';

            mensaje.textContent =
                'Error: ' + error.message;

        }

    }

);

</script>


</body>

</html>
