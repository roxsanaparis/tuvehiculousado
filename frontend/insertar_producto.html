<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrar vehículo</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background: #f4f6f8;
            color: #172033;
            font-family: Arial, Helvetica, sans-serif;
        }

        .card {
            border: none;
            border-radius: 14px;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control,
        .form-select {
            padding: 10px 12px;
            border-radius: 8px;
        }

    </style>

</head>

<body>

<div class="container py-5">

    <div class="card shadow-sm mx-auto" style="max-width: 850px;">

        <div class="card-body p-4 p-md-5">

            <h2 class="text-center mb-2">
                Registrar vehículo
            </h2>

            <p class="text-center text-muted mb-4">
                Completa los atributos del vehículo.
            </p>

            <form id="producto-form">

                <div class="row g-3">

                    <div class="col-md-4">

                        <label for="tipo" class="form-label">
                            Tipo
                        </label>

                        <select id="tipo" class="form-select" required>

                            <option value="">Selecciona</option>
                            <option>Automóvil</option>
                            <option>Automovil</option>
                            <option>Camioneta</option>
                            <option>Moto</option>
                            <option>Camión</option>
                            <option>Otro</option>

                        </select>

                    </div>

                    <div class="col-md-4">

                        <label for="marca" class="form-label">
                            Marca
                        </label>

                        <input
                            type="text"
                            id="marca"
                            class="form-control"
                            placeholder="Ej. Toyota"
                            required>

                    </div>

                    <div class="col-md-4">

                        <label for="modelo" class="form-label">
                            Modelo
                        </label>

                        <input
                            type="text"
                            id="modelo"
                            class="form-control"
                            placeholder="Ej. Corolla"
                            required>

                    </div>

                    <div class="col-md-4">

                        <label for="anio" class="form-label">
                            Año
                        </label>

                        <input
                            type="number"
                            id="anio"
                            class="form-control"
                            min="1900"
                            max="2100"
                            required>

                    </div>

                    <div class="col-md-4">

                        <label for="combustible" class="form-label">
                            Combustible
                        </label>

                        <select id="combustible" class="form-select" required>

                            <option value="">Selecciona</option>
                            <option>Gasolina</option>
                            <option>Diésel</option>
                            <option>Gas</option>
                            <option>Híbrido</option>
                            <option>Eléctrico</option>

                        </select>

                    </div>

                    <div class="col-md-4">

                        <label for="transmision" class="form-label">
                            Transmisión
                        </label>

                        <select id="transmision" class="form-select" required>

                            <option value="">Selecciona</option>
                            <option>Manual</option>
                            <option>Automática</option>
                            <option>CVT</option>

                        </select>

                    </div>

                    <div class="col-md-4">

                        <label for="kilometraje" class="form-label">
                            Kilometraje (km)
                        </label>

                        <input
                            type="number"
                            id="kilometraje"
                            class="form-control"
                            min="0"
                            required>

                    </div>

                    <div class="col-md-4">

                        <label for="precio" class="form-label">
                            Precio (COP)
                        </label>

                        <input
                            type="number"
                            id="precio"
                            class="form-control"
                            min="0"
                            required>

                    </div>

                    <div class="col-md-4">

                        <label for="estado" class="form-label">
                            Estado
                        </label>

                        <select id="estado" class="form-select" required>

                            <option>Disponible</option>
                            <option>Reservado</option>
                            <option>Vendido</option>

                        </select>

                    </div>

                    <div class="col-12">

                        <label for="descripcion" class="form-label">
                            Descripción adicional
                        </label>

                        <textarea
                            id="descripcion"
                            class="form-control"
                            rows="3"
                            placeholder="Información adicional del vehículo"></textarea>

                    </div>

                </div>

                <!-- CANTIDAD INTERNA PARA COMPATIBILIDAD -->

                <input type="hidden" id="cantidad" value="1">

                <div class="d-grid mt-4">

                    <button
                        type="submit"
                        id="guardar"
                        class="btn btn-success">

                        Guardar vehículo

                    </button>

                </div>

            </form>

            <div
                id="mensaje"
                class="alert mt-4 d-none"
                role="alert">
            </div>

            <div class="text-center mt-3">

                <a href="admin.html" class="btn btn-secondary">
                    Volver al panel
                </a>

            </div>

        </div>

    </div>

</div>

<script>

// OBTENER USUARIO

function obtenerUsuario() {

    try {

        return JSON.parse(
            localStorage.getItem("usuario")
        );

    } catch (error) {

        return null;

    }

}

const usuario = obtenerUsuario();

const formulario =
    document.getElementById("producto-form");

const mensaje =
    document.getElementById("mensaje");

const boton =
    document.getElementById("guardar");

// VALIDAR SESIÓN

if (!usuario) {

    alert("Inicia sesión para continuar.");

    window.location.href = "index.html";

}

// VALIDAR ROL

else if (
    !["administrador", "admin"].includes(
        String(usuario.rol).toLowerCase()
    )
) {

    alert("Debes iniciar sesión como administrador.");

    window.location.href = "admin.html";

}

// MOSTRAR MENSAJE

function mostrarMensaje(texto, tipo = "danger") {

    mensaje.className = `alert alert-${tipo} mt-4`;

    mensaje.textContent = texto;

}

// REGISTRAR VEHÍCULO

formulario.addEventListener("submit", async function(event) {

    event.preventDefault();

    const datos = {

        tipo: document.getElementById("tipo").value,

        marca: document.getElementById("marca").value.trim(),

        modelo: document.getElementById("modelo").value.trim(),

        anio: Number(
            document.getElementById("anio").value
        ),

        combustible:
            document.getElementById("combustible").value,

        transmision:
            document.getElementById("transmision").value,

        kilometraje: Number(
            document.getElementById("kilometraje").value
        ),

        precio: Number(
            document.getElementById("precio").value
        ),

        estado:
            document.getElementById("estado").value,

        cantidad: 1,

        descripcion:
            document.getElementById("descripcion").value.trim(),

        usuario_id: Number(usuario.id)

    };

    if (!datos.usuario_id) {

        mostrarMensaje(
            "No se encontró el ID del administrador."
        );

        return;

    }

    boton.disabled = true;

    boton.textContent = "Guardando vehículo...";

    try {

        const respuesta = await fetch(
            "/api/vehiculos",
            {

                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "rol": usuario.rol
                },

                body: JSON.stringify(datos)

            }
        );

        const texto = await respuesta.text();

        let resultado = {};

        try {

            resultado = texto
                ? JSON.parse(texto)
                : {};

        } catch (error) {

            resultado = {
                mensaje: texto
            };

        }

        if (!respuesta.ok) {

            throw new Error(
                resultado.error ||
                resultado.mensaje ||
                resultado.message ||
                "El servidor rechazó el vehículo."
            );

        }

        mostrarMensaje(
            resultado.mensaje ||
            resultado.message ||
            "Vehículo registrado correctamente.",
            "success"
        );

        formulario.reset();

        document.getElementById("cantidad").value = "1";

    } catch (error) {

        mostrarMensaje(
            "Error al registrar el vehículo: " + error.message
        );

    } finally {

        boton.disabled = false;

        boton.textContent = "Guardar vehículo";

    }

});

</script>

</body>
</html>
