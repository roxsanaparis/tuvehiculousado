<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Tu Vehículo Usado | Panel</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background: #f4f6f8;
            min-height: 100vh;
        }

        .navbar-brand {
            font-weight: 700;
        }

        .hero {
            background: linear-gradient(
                135deg,
                #111827,
                #374151
            );

            color: white;
            border-radius: 16px;
            padding: 35px;
            margin-bottom: 30px;
        }

        .card {
            border: none;
            border-radius: 14px;
        }

        .table thead th {
            white-space: nowrap;
        }

        .precio {
            font-weight: 600;
        }

    </style>

</head>


<body>


<!-- ==========================================
     NAVBAR
========================================== -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <span class="navbar-brand">
            Tu Vehículo Usado
        </span>

        <button
            onclick="cerrarSesion()"
            class="btn btn-outline-light btn-sm">

            Cerrar sesión

        </button>

    </div>

</nav>


<div class="container py-4">


    <!-- ==========================================
         ENCABEZADO
    ========================================== -->

    <div class="hero">

        <h1 class="mb-2">
            Panel de administración
        </h1>

        <p
            id="bienvenida"
            class="mb-0">
        </p>

    </div>


    <!-- ==========================================
         OPCIONES ADMINISTRADOR
    ========================================== -->

    <div
        id="opcionesAdmin"
        class="mb-4"
        style="display: none;">

        <div class="card shadow-sm">

            <div class="card-body">

                <h4 class="mb-3">
                    Administración
                </h4>

                <p class="text-muted">
                    Gestiona los usuarios registrados
                    en el sistema.
                </p>

                <a
                    href="usuarios.html"
                    class="btn btn-primary">

                    Gestionar usuarios

                </a>

            </div>

        </div>

    </div>


    <!-- ==========================================
         FORMULARIO AGREGAR VEHÍCULO
    ========================================== -->

    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <h3 class="mb-3">
                Agregar vehículo
            </h3>

            <form id="formVehiculo">

                <div class="row g-3">


                    <div class="col-md-6">

                        <label class="form-label">
                            Nombre
                        </label>

                        <input
                            type="text"
                            id="nombre"
                            class="form-control"
                            required>

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Precio
                        </label>

                        <input
                            type="number"
                            id="precio"
                            class="form-control"
                            min="0"
                            required>

                    </div>


                    <div class="col-md-4">

                        <label class="form-label">
                            Cantidad
                        </label>

                        <input
                            type="number"
                            id="cantidad"
                            class="form-control"
                            min="1"
                            required>

                    </div>


                    <div class="col-md-4">

                        <label class="form-label">
                            Tipo
                        </label>

                        <select
                            id="tipo"
                            class="form-select"
                            required>

                            <option value="">
                                Seleccionar
                            </option>

                            <option value="Automovil">
                                Automóvil
                            </option>

                            <option value="Moto">
                                Moto
                            </option>

                            <option value="Camioneta">
                                Camioneta
                            </option>

                            <option value="Camion">
                                Camión
                            </option>

                        </select>

                    </div>


                    <div class="col-md-4">

                        <label class="form-label">
                            Marca
                        </label>

                        <input
                            type="text"
                            id="marca"
                            class="form-control"
                            required>

                    </div>


                    <div class="col-md-4">

                        <label class="form-label">
                            Modelo
                        </label>

                        <input
                            type="text"
                            id="modelo"
                            class="form-control"
                            required>

                    </div>


                    <div class="col-md-4">

                        <label class="form-label">
                            Año
                        </label>

                        <input
                            type="number"
                            id="anio"
                            class="form-control"
                            min="1900"
                            max="2100"
                            required>

                    </div>


                    <div class="col-md-4">

                        <label class="form-label">
                            Descripción
                        </label>

                        <input
                            type="text"
                            id="descripcion"
                            class="form-control">

                    </div>


                    <div class="col-12">

                        <button
                            type="submit"
                            class="btn btn-success">

                            Crear vehículo

                        </button>

                    </div>

                </div>

            </form>


            <div
                id="mensajeCrear"
                class="mt-3">
            </div>

        </div>

    </div>


    <!-- ==========================================
         LISTADO DE VEHÍCULOS
    ========================================== -->

    <div class="d-flex justify-content-between align-items-center mb-3">

        <div>

            <h3 class="mb-1">
                Vehículos
            </h3>

            <p class="text-muted mb-0">
                Consulta los vehículos disponibles
                en el sistema.
            </p>

        </div>

    </div>


    <div class="card shadow-sm">

        <div class="card-body p-0">

            <div class="table-responsive">

                <table
                    class="table table-hover align-middle mb-0">

                    <thead class="table-dark">

                        <tr>

                            <th>ID</th>

                            <th>Vehículo</th>

                            <th>Marca</th>

                            <th>Modelo</th>

                            <th>Año</th>

                            <th>Tipo</th>

                            <th>Precio</th>

                            <th>Cantidad</th>

                        </tr>

                    </thead>


                    <tbody id="vehiculos">

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <div
        id="mensaje"
        class="mt-3">
    </div>


</div>


<script>


// ==========================================
// API
// ==========================================

const URL_VEHICULOS =
    "/api/vehiculos";


// ==========================================
// COMPROBAR USUARIO
// ==========================================

const usuarioGuardado =
    localStorage.getItem("usuario");


if (!usuarioGuardado) {

    window.location.href =
        "index.html";

}


const usuario =
    JSON.parse(usuarioGuardado);


// ==========================================
// VALIDAR ROL
// ==========================================

if (
    usuario.rol !== "vendedor" &&
    usuario.rol !== "administrador"
) {

    window.location.href =
        "index.html";

}


// ==========================================
// BIENVENIDA
// ==========================================

document.getElementById(
    "bienvenida"
).textContent =
    "Bienvenido, " + usuario.nombre;


// ==========================================
// OPCIONES ADMINISTRADOR
// ==========================================

if (
    usuario.rol === "administrador"
) {

    document.getElementById(
        "opcionesAdmin"
    ).style.display = "block";

}


// ==========================================
// CARGAR VEHÍCULOS
// ==========================================

async function cargarVehiculos() {

    const tabla =
        document.getElementById(
            "vehiculos"
        );


    const mensaje =
        document.getElementById(
            "mensaje"
        );


    tabla.innerHTML = `

        <tr>

            <td
                colspan="8"
                class="text-center py-4">

                Cargando vehículos...

            </td>

        </tr>

    `;


    mensaje.innerHTML = "";


    try {

        const respuesta =
            await fetch(
                URL_VEHICULOS
            );


        const datos =
            await respuesta.json();


        if (!respuesta.ok) {

            throw new Error(
                datos.error ||
                datos.mensaje ||
                "No se pudieron consultar los vehículos"
            );

        }


        if (
            !Array.isArray(datos) ||
            datos.length === 0
        ) {

            tabla.innerHTML = `

                <tr>

                    <td
                        colspan="8"
                        class="text-center py-4 text-muted">

                        No hay vehículos registrados.

                    </td>

                </tr>

            `;

            return;

        }


        tabla.innerHTML = "";


        datos.forEach(
            vehiculo => {

                const fila =
                    document.createElement(
                        "tr"
                    );


                fila.innerHTML = `

                    <td>
                        ${vehiculo.id}
                    </td>

                    <td>

                        <strong>
                            ${vehiculo.nombre || "Vehículo"}
                        </strong>

                        ${
                            vehiculo.descripcion
                            ?

                            `<br>
                             <small class="text-muted">
                                ${vehiculo.descripcion}
                             </small>`

                            :

                            ""
                        }

                    </td>


                    <td>
                        ${vehiculo.marca || "-"}
                    </td>


                    <td>
                        ${vehiculo.modelo || "-"}
                    </td>


                    <td>
                        ${vehiculo.anio || "-"}
                    </td>


                    <td>
                        ${vehiculo.tipo || "-"}
                    </td>


                    <td class="precio">

                        $ ${Number(
                            vehiculo.precio || 0
                        ).toLocaleString(
                            "es-CO"
                        )}

                    </td>


                    <td>

                        ${
                            Number(
                                vehiculo.cantidad
                            ) > 0

                            ?

                            `<span class="badge text-bg-success">
                                ${vehiculo.cantidad}
                             </span>`

                            :

                            `<span class="badge text-bg-secondary">
                                Agotado
                             </span>`
                        }

                    </td>

                `;


                tabla.appendChild(
                    fila
                );

            }
        );


    } catch (error) {

        console.error(
            "Error:",
            error
        );


        tabla.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="text-center py-4 text-danger">

                    No fue posible cargar los vehículos.

                </td>

            </tr>

        `;


        mensaje.innerHTML = `

            <div class="alert alert-danger">

                ${error.message}

            </div>

        `;

    }

}


// ==========================================
// CREAR VEHÍCULO
// ==========================================

document.getElementById(
    "formVehiculo"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const mensaje =
            document.getElementById(
                "mensajeCrear"
            );


        mensaje.innerHTML = `

            <div class="alert alert-info">

                Creando vehículo...

            </div>

        `;


        const vehiculo = {

            nombre:
                document.getElementById(
                    "nombre"
                ).value.trim(),

            precio:
                Number(
                    document.getElementById(
                        "precio"
                    ).value
                ),

            cantidad:
                Number(
                    document.getElementById(
                        "cantidad"
                    ).value
                ),

            tipo:
                document.getElementById(
                    "tipo"
                ).value,

            marca:
                document.getElementById(
                    "marca"
                ).value.trim(),

            modelo:
                document.getElementById(
                    "modelo"
                ).value.trim(),

            anio:
                Number(
                    document.getElementById(
                        "anio"
                    ).value
                ),

            descripcion:
                document.getElementById(
                    "descripcion"
                ).value.trim(),

            usuario_id:
                usuario.id || null

        };


        try {


            const respuesta =
                await fetch(
                    URL_VEHICULOS,
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify(
                                vehiculo
                            )

                    }
                );


            const texto =
                await respuesta.text();


            let datos;


            try {

                datos =
                    JSON.parse(
                        texto
                    );

            } catch {

                throw new Error(
                    "El servidor devolvió una respuesta que no es JSON: " +
                    texto.substring(
                        0,
                        200
                    )
                );

            }


            if (!respuesta.ok) {

                throw new Error(
                    datos.error ||
                    datos.mensaje ||
                    "No fue posible crear el vehículo"
                );

            }


            mensaje.innerHTML = `

                <div class="alert alert-success">

                    Vehículo creado correctamente.

                </div>

            `;


            document.getElementById(
                "formVehiculo"
            ).reset();


            await cargarVehiculos();


        } catch (error) {

            console.error(
                "Error al crear vehículo:",
                error
            );


            mensaje.innerHTML = `

                <div class="alert alert-danger">

                    Error al crear el vehículo:
                    ${error.message}

                </div>

            `;

        }

    }
);


// ==========================================
// CERRAR SESIÓN
// ==========================================

function cerrarSesion() {

    localStorage.removeItem(
        "usuario"
    );


    window.location.href =
        "index.html";

}


// ==========================================
// INICIAR
// ==========================================

cargarVehiculos();


</script>


</body>

</html>
