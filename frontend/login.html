<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Iniciar sesión - Tu Vehículo Usado
    </title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


<div class="container py-5">


    <div
        class="card shadow mx-auto"
        style="max-width: 450px;">

        <div class="card-body p-4">


            <h2 class="text-center mb-4">

                Tu Vehículo Usado

            </h2>


            <h4 class="text-center mb-4">

                Iniciar sesión

            </h4>


            <form id="formLogin">


                <!-- CORREO -->

                <div class="mb-3">

                    <label class="form-label">

                        Correo

                    </label>


                    <input
                        type="email"
                        id="correo"
                        class="form-control"
                        required>

                </div>


                <!-- CONTRASEÑA -->

                <div class="mb-3">

                    <label class="form-label">

                        Contraseña

                    </label>


                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        required>

                </div>


                <!-- BOTÓN -->

                <button
                    type="submit"
                    class="btn btn-dark w-100">

                    Iniciar sesión

                </button>


            </form>


            <!-- MENSAJE -->

            <div
                id="mensaje"
                class="mt-3 text-center">
            </div>


            <!-- REGISTRAR -->

            <a
                href="registrar_usuario.html"
                class="btn btn-secondary w-100 mt-3">

                Crear cuenta

            </a>


        </div>

    </div>

</div>


<script>


// ==========================================
// LOGIN
// ==========================================

document
    .getElementById("formLogin")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            // ==================================
            // OBTENER DATOS
            // ==================================

            const correo =
                document
                    .getElementById("correo")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            try {


                // ==================================
                // CONSULTAR MICROservicio USUARIOS
                // ==================================

                const respuesta = await fetch(
    `/api/usuarios/validar?correo=${encodeURIComponent(correo)}&password=${encodeURIComponent(password)}`
);


                const datos =
                    await respuesta.json();


                // ==================================
                // CREDENCIALES INCORRECTAS
                // ==================================

                if (!respuesta.ok) {

                    document
                        .getElementById("mensaje")
                        .textContent =
                        datos.mensaje ||
                        datos.error ||
                        "Credenciales incorrectas.";

                    return;

                }


                // ==================================
                // GUARDAR USUARIO
                // ==================================

                localStorage.setItem(

                    "usuario",

                    JSON.stringify(
                        datos.usuario
                    )

                );


                // ==================================
                // IDENTIFICAR ROL
                // ==================================

                const rol =
                    datos.usuario.rol;


                // ==================================
                // ADMINISTRADOR
                // ==================================

                if (
                    rol === "administrador"
                ) {

                    window.location.href =
                        "admin.html";

                    return;

                }


                // ==================================
                // VENDEDOR
                // ==================================

                if (
                    rol === "vendedor"
                ) {

                    window.location.href =
                        "vendedor.html";

                    return;

                }


                // ==================================
                // CLIENTE
                // ==================================

                if (
                    rol === "cliente"
                ) {

                    window.location.href =
                        "cliente.html";

                    return;

                }


                // ==================================
                // ROL NO RECONOCIDO
                // ==================================

                document
                    .getElementById("mensaje")
                    .textContent =
                    "El usuario tiene un rol no reconocido.";

                localStorage.removeItem(
                    "usuario"
                );


            } catch (error) {


                console.error(
                    "Error:",
                    error
                );


                document
                    .getElementById("mensaje")
                    .textContent =
                    "Error al conectar con el servidor.";

            }

        }
    );

</script>


</body>

</html>
