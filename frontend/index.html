<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tu Vehículo Usado | Iniciar sesión</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            min-height: 100vh;
            background:
                linear-gradient(
                    rgba(15, 23, 42, 0.88),
                    rgba(15, 23, 42, 0.92)
                ),
                linear-gradient(135deg, #1e293b, #334155);

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-wrapper {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .brand {
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }

        .brand h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .brand p {
            color: #cbd5e1;
            margin: 0;
        }

        .login-card {
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.30);
        }

        .login-card h2 {
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: #64748b;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 600;
            color: #334155;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
        }

        .form-control:focus {
            border-color: #334155;
            box-shadow:
                0 0 0 0.2rem rgba(51, 65, 85, 0.15);
        }

        .btn-login {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 13px;
            background: #1e293b;
            color: white;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-login:hover {
            background: #0f172a;
        }

        .register-section {
            text-align: center;
            margin-top: 25px;
            padding-top: 22px;
            border-top: 1px solid #e2e8f0;
        }

        .register-section p {
            color: #64748b;
            margin-bottom: 10px;
        }

        .btn-register {
            width: 100%;
            border-radius: 10px;
            padding: 11px;
            font-weight: 600;
        }

        #mensaje {
            min-height: 24px;
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .footer {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            margin-top: 20px;
        }

    </style>

</head>

<body>

    <div class="login-wrapper">

        <div class="brand">

            <h1>Tu Vehículo Usado</h1>

            <p>
                Compra y venta de vehículos usados
            </p>

        </div>


        <div class="login-card">

            <h2 class="text-center">
                Iniciar sesión
            </h2>

            <p class="login-subtitle text-center">
                Ingresa a tu cuenta para continuar
            </p>


            <form id="formLogin">

                <div class="mb-3">

                    <label
                        for="correo"
                        class="form-label">

                        Correo electrónico

                    </label>

                    <input
                        type="email"
                        id="correo"
                        class="form-control"
                        placeholder="correo@ejemplo.com"
                        autocomplete="email"
                        required>

                </div>


                <div class="mb-4">

                    <label
                        for="password"
                        class="form-label">

                        Contraseña

                    </label>

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                        required>

                </div>


                <button
                    type="submit"
                    class="btn-login">

                    Iniciar sesión

                </button>

            </form>


            <div id="mensaje"></div>


            <div class="register-section">

                <p>
                    ¿Aún no tienes una cuenta?
                </p>

                <a
                    href="registrar_usuario.html"
                    class="btn btn-outline-dark btn-register">

                    Crear una cuenta

                </a>

            </div>

        </div>


        <div class="footer">

            Tu Vehículo Usado · Plataforma de compra y venta

        </div>

    </div>


    <script>

        document
            .getElementById("formLogin")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const correo =
                        document
                            .getElementById("correo")
                            .value
                            .trim();


                    const password =
                        document
                            .getElementById("password")
                            .value;


                    const mensaje =
                        document.getElementById("mensaje");


                    mensaje.className = "";
                    mensaje.textContent =
                        "Validando información...";


                    try {

                        const respuesta = await fetch(
    `/api/usuarios/validar?correo=${encodeURIComponent(correo)}&password=${encodeURIComponent(password)}`
);


                        const datos =
                            await respuesta.json();


                        if (!respuesta.ok) {

                            mensaje.className =
                                "text-danger";

                            mensaje.textContent =
                                datos.mensaje ||
                                "Correo o contraseña incorrectos.";

                            return;
                        }


                        localStorage.setItem(
                            "usuario",
                            JSON.stringify(datos.usuario)
                        );


                      if (datos.usuario.rol === "administrador") {

    window.location.href = "admin.html";

} else if (datos.usuario.rol === "vendedor") {

    window.location.href = "vendedor.html";

} else {

    window.location.href = "cliente.html";

}


                    } catch (error) {

                        console.error(error);


                        mensaje.className =
                            "text-danger";


                        mensaje.textContent =
                            "No fue posible conectar con el servidor.";

                    }

                }
            );

    </script>

</body>

</html>
