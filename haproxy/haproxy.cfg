global
    log stdout format raw local0

defaults
    mode http
    log global
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend api
    bind *:80

    acl usuarios path_beg /api/usuarios
    acl vehiculos path_beg /api/vehiculos
    acl compras path_beg /api/compras

    use_backend usuarios_backend if usuarios
    use_backend vehiculos_backend if vehiculos
    use_backend compras_backend if compras

    default_backend usuarios_backend

backend usuarios_backend
    balance roundrobin
    server usuarios1 almacen_usuarios:3010 check

backend vehiculos_backend
    balance roundrobin
    server vehiculos1 almacen_vehiculos:3011 check

backend compras_backend
    balance roundrobin
    server compras1 almacen_compras:3012 check
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
