global
    log /dev/log local0
    log /dev/log local1 notice

    chroot /var/lib/haproxy

    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s

    user haproxy
    group haproxy
    daemon

    ca-base /etc/ssl/certs
    crt-base /etc/ssl/private

defaults
    log global
    mode http
    option httplog
    option dontlognull

    timeout connect 5000
    timeout client 50000
    timeout server 50000

    errorfile 400 /usr/local/etc/haproxy/errors/400.http
    errorfile 403 /usr/local/etc/haproxy/errors/403.http
    errorfile 408 /usr/local/etc/haproxy/errors/408.http
    errorfile 500 /usr/local/etc/haproxy/errors/500.http
    errorfile 502 /usr/local/etc/haproxy/errors/502.http
    errorfile 503 /usr/local/etc/haproxy/errors/503.http
    errorfile 504 /usr/local/etc/haproxy/errors/504.http

backend frontend-backend
    server frontend frontend:80 check

backend vehiculos-backend
    server vehiculos almacen_vehiculos:3011 check

backend usuarios-backend
    server usuarios almacen_usuarios:3010 check

backend compras-backend
    server compras almacen_compras:3012 check

frontend http
    bind *:80

    acl api_vehiculos path_beg /api/vehiculos
    acl api_usuarios path_beg /api/usuarios
    acl api_compras path_beg /api/compras

    use_backend vehiculos-backend if api_vehiculos
    use_backend usuarios-backend if api_usuarios
    use_backend compras-backend if api_compras

    default_backend frontend-backend
