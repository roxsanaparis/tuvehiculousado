services:

  mysql-usuarios:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: usuarios_db
      MYSQL_USER: capasapp
      MYSQL_PASSWORD: admin
    volumes:
      - mysql_usuarios_data:/var/lib/mysql
    networks:
      - almacen-net
    deploy:
      replicas: 1

  mysql-vehiculos:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vehiculos_db
      MYSQL_USER: capasapp
      MYSQL_PASSWORD: admin
    volumes:
      - mysql_vehiculos_data:/var/lib/mysql
    networks:
      - almacen-net
    deploy:
      replicas: 1

  mysql-compras:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: compras_db
      MYSQL_USER: capasapp
      MYSQL_PASSWORD: admin
    volumes:
      - mysql_compras_data:/var/lib/mysql
    networks:
      - almacen-net
    deploy:
      replicas: 1

  usuarios:
    image: roxsanaparis/proyecto-usuarios:1.0
    ports:
      - "3010:3010"
    networks:
      - almacen-net
    deploy:
      replicas: 2

  vehiculos:
    image: roxsanaparis/proyecto-vehiculos:1.0
    ports:
      - "3011:3011"
    networks:
      - almacen-net
    deploy:
      replicas: 2

  compras:
    image: roxsanaparis/proyecto-compras:1.0
    ports:
      - "3012:3012"
    networks:
      - almacen-net
    deploy:
      replicas: 2

  haproxy:
    image: haproxy:2.9
    ports:
      - "5081:80"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - almacen-net
    deploy:
      replicas: 1

networks:
  almacen-net:
    driver: overlay
    attachable: true

volumes:
  mysql_usuarios_data:
  mysql_vehiculos_data:
  mysql_compras_data:
