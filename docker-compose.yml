
services:
  mysql-usuarios:
    image: mysql:8.0
    container_name: mysql-usuarios
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: usuarios_db
      MYSQL_USER: "${MYSQL_APP_USER:?Falta MYSQL_APP_USER}"
      MYSQL_PASSWORD: "${MYSQL_APP_PASSWORD:?Falta MYSQL_APP_PASSWORD}"
    volumes:
      - mysql_usuarios_data:/var/lib/mysql
    networks:
      - almacen-net

  mysql-vehiculos:
    image: mysql:8.0
    container_name: mysql-vehiculos
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: vehiculos_db
      MYSQL_USER: "${MYSQL_APP_USER:?Falta MYSQL_APP_USER}"
      MYSQL_PASSWORD: "${MYSQL_APP_PASSWORD:?Falta MYSQL_APP_PASSWORD}"
    volumes:
      - mysql_vehiculos_data:/var/lib/mysql
    networks:
      - almacen-net

  mysql-compras:
    image: mysql:8.0
    container_name: mysql-compras
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: compras_db
      MYSQL_USER: "${MYSQL_APP_USER:?Falta MYSQL_APP_USER}"
      MYSQL_PASSWORD: "${MYSQL_APP_PASSWORD:?Falta MYSQL_APP_PASSWORD}"
    volumes:
      - mysql_compras_data:/var/lib/mysql
    networks:
      - almacen-net

  usuarios:
    image: roxsanaparis/proyecto-usuarios:4.2
    container_name: microservicio-usuarios
    ports:
      - "3010:3010"
    environment:
      DB_USER: "${MYSQL_APP_USER:?Falta MYSQL_APP_USER}"
      DB_PASSWORD: "${MYSQL_APP_PASSWORD:?Falta MYSQL_APP_PASSWORD}"
    depends_on:
      - mysql-usuarios
    networks:
      - almacen-net

  vehiculos:
    image: roxsanaparis/proyecto-vehiculos:4.1
    container_name: microservicio-vehiculos
    ports:
      - "3011:3011"
    environment:
      DB_USER: "${MYSQL_APP_USER:?Falta MYSQL_APP_USER}"
      DB_PASSWORD: "${MYSQL_APP_PASSWORD:?Falta MYSQL_APP_PASSWORD}"
    depends_on:
      - mysql-vehiculos
    networks:
      - almacen-net

  compras:
    image: roxsanaparis/proyecto-compras:4.4
    container_name: microservicio-compras
    ports:
      - "3012:3012"
    environment:
      DB_USER: "${MYSQL_APP_USER:?Falta MYSQL_APP_USER}"
      DB_PASSWORD: "${MYSQL_APP_PASSWORD:?Falta MYSQL_APP_PASSWORD}"
    depends_on:
      - mysql-compras
      - usuarios
      - vehiculos
    networks:
      - almacen-net


  haproxy:
    image: haproxy:2.9
    ports:
      - "5081:80"
      - "8404:8404"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - almacen-net
    deploy:
      replicas: 1

  api-analitica:
    image: roxsanaparis/api-analitica:1.7
    environment:
      DB_USUARIOS_HOST: mysql-usuarios
      DB_VEHICULOS_HOST: mysql-vehiculos
      DB_COMPRAS_HOST: mysql-compras
      DB_USER: "${ANALYTICS_DB_USER:?Falta ANALYTICS_DB_USER}"
      DB_PASSWORD: "${ANALYTICS_DB_PASSWORD:?Falta ANALYTICS_DB_PASSWORD}"
    ports:
      - "5000:5000"
    depends_on:
      - mysql-usuarios
      - mysql-vehiculos
      - mysql-compras
    networks:
      - almacen-net


networks:
  almacen-net:
    driver: bridge

volumes:
  mysql_usuarios_data:
  mysql_vehiculos_data:
  mysql_compras_data:
